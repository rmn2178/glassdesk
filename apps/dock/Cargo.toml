[package]
name = "nosih"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
recover-browser-z-order = []

[build-dependencies]
winresource = "0.1"

[dependencies]
anyhow.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
nosih-config.workspace = true
nosih-core.workspace = true
nosih-shell.workspace = true
png = "0.18"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "system-proxy"] }
serde.workspace = true
serde_json = "1"
windows-core.workspace = true
windows-collections = "0.3"
windows-future = "0.3"
windows-numerics.workspace = true
windows = { workspace = true, features = [
    "Devices_Enumeration",
    "Devices_Radios",
    "Devices_HumanInterfaceDevice",
    "Foundation",
    "Graphics",
    "Graphics_DirectX",
    "Media_Control",
    "Storage_Streams",
    "System",
    "UI",
    "UI_Composition",
    "UI_Composition_Desktop",
    "Win32_Foundation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_JobObjects",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Composition",
    "Win32_System_Ole",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
windows = { workspace = true, features = ["Win32_System_Pipes"] }
