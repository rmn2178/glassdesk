name: Release Nosih

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/settings/pnpm-lock.yaml

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Settings UI dependencies
        working-directory: apps/settings
        run: pnpm install --frozen-lockfile

      - name: Build Nosih release installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/build-installer.ps1

      - name: Prepare release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item target/release/nosih.exe release-assets/nosih.exe -Force
          Copy-Item target/release/nosih-settings.exe release-assets/nosih-settings.exe -Force
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw 'NSIS installer was not produced' }
          Copy-Item $setup.FullName release-assets/Nosih-Setup.exe -Force
          $sig = Get-ChildItem target/release/bundle/nsis/*-setup.exe.sig -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sig) {
            Copy-Item $sig.FullName release-assets/Nosih-Setup.exe.sig -Force
            $version = ((cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).packages | Where-Object name -eq 'nosih-settings').version
            if (-not $version) { throw 'Could not resolve nosih-settings version from Cargo metadata' }
            $manifest = [ordered]@{
              version   = $version
              notes     = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/v$version"
              pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
              platforms = [ordered]@{
                "windows-x86_64" = [ordered]@{
                  signature = (Get-Content $sig.FullName -Raw).Trim()
                  url       = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$version/Nosih-Setup.exe"
                }
              }
            }
            $manifest | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 release-assets/latest.json
          }
          Get-FileHash release-assets/* -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $(Split-Path -Leaf $_.Path)" } |
            Set-Content -Encoding utf8 release-assets/SHA256SUMS.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nosih-release-windows-x64
          path: release-assets/
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: release-assets/*
