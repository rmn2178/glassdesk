name: Build GLASSDESK (Windows x64)

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 (NSIS + MSI + Portable EXE)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: "glassdesk-windows"

      - name: Install frontend dependencies
        shell: pwsh
        run: npm install

      - name: Type-check and build frontend (creates dist/ for Tauri context)
        shell: pwsh
        run: npm run build

      - name: Run Rust unit tests
        shell: pwsh
        working-directory: src-tauri
        run: cargo test
        env:
          CARGO_TERM_COLOR: always

      - name: Build Tauri 2 Windows x64 installers (NSIS & MSI)
        shell: pwsh
        run: npx tauri build --bundles "nsis,msi"
        env:
          RUST_BACKTRACE: "1"
          CARGO_TERM_COLOR: always

      - name: Upload NSIS Installer (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: GLASSDESK-Windows-x64-NSIS-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload MSI Installer (.msi)
        uses: actions/upload-artifact@v4
        with:
          name: GLASSDESK-Windows-x64-MSI-Installer
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload Portable Executable (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: GLASSDESK-Windows-x64-Portable
          path: src-tauri/target/release/glassdesk.exe
          if-no-files-found: error

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/glassdesk.exe
