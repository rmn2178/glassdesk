<!DOCTYPE html>
<html
  lang="en"
  data-theme="dark"
  data-accent="silver"
  data-island-style="bar"
  data-motion="normal"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GLASSDESK</title>
    <link rel="stylesheet" href="./styles/global.css" />
    <link rel="stylesheet" href="./styles/glass.css" />
    <link rel="stylesheet" href="./styles/island.css" />
    <link rel="stylesheet" href="./styles/panels.css" />
  </head>
  <body>
    <div id="app" class="gd-root">
      <!-- Top-edge hover sensor to wake auto-hidden Dynamic Island -->
      <div id="top-edge-hotspot" class="gd-top-hotspot" aria-hidden="true"></div>
      <!-- Top Shell: Floating Dynamic Island (default) or Slim Top Menu Bar -->
      <header id="top-bar" class="gd-topbar glass-bar" role="banner">
        <!-- LEFT ZONE (visible in Top Bar mode) -->
        <div class="gd-zone gd-zone-left">
          <button
            id="brand-btn"
            class="gd-pill-btn gd-brand"
            type="button"
            title="GLASSDESK Overview"
            aria-label="Open GLASSDESK Overview"
          >
            <span class="gd-emblem" aria-hidden="true">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="5"></rect>
                <line x1="7" y1="9" x2="17" y2="9"></line>
              </svg>
            </span>
            <span class="gd-brand-name">GLASSDESK</span>
          </button>

          <div class="gd-divider" aria-hidden="true"></div>

          <div id="active-app" class="gd-active-app" title="Active Application">
            <span class="gd-status-dot" id="active-status-dot"></span>
            <span class="gd-app-name" id="active-app-name">Windows Explorer</span>
          </div>
        </div>

        <!-- CENTER ZONE: Floating Liquid Glass Dynamic Island Capsule -->
        <div class="gd-zone gd-zone-center">
          <div
            id="dynamic-island"
            class="gd-island glass-primary glass-capsule"
            role="button"
            tabindex="0"
            aria-expanded="false"
            aria-label="GLASSDESK Dynamic Island"
          >
            <!-- Mode A — Compact Idle Capsule -->
            <div class="gd-island-idle" id="island-idle">
              <span class="gd-island-indicator" id="island-indicator" title="GLASSDESK Active"></span>

              <button
                id="island-time-badge"
                class="gd-island-time-btn"
                type="button"
                title="Clock & Calendar"
              >
                <span class="gd-island-time" id="island-clock-time">--:--</span>
              </button>

              <!-- Live Focus Timer Pill (visible only while timer is running) -->
              <button
                id="island-timer-badge"
                class="gd-island-chip gd-timer-chip"
                type="button"
                title="Focus Timer Active — Open Control Center"
                hidden
              >
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"></circle>
                  <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span id="island-timer-label">25:00</span>
              </button>

              <button
                id="island-music-badge"
                class="gd-island-chip gd-music-chip"
                type="button"
                title="Now Playing"
              >
                <span id="island-music-eq" class="eq-bars eq-bars-sm" aria-hidden="true">
                  <span></span><span></span><span></span>
                </span>
                <span id="island-music-label">Music</span>
              </button>

              <button
                id="island-files-badge"
                class="gd-island-chip"
                type="button"
                title="File Drop & Recent Files"
              >
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                </svg>
                <span id="island-files-count">0</span>
              </button>

              <button
                id="island-tasks-badge"
                class="gd-island-chip"
                type="button"
                title="Tasks & Reminders"
              >
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="9 11 12 14 22 4"></polyline>
                  <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                </svg>
                <span id="island-tasks-count">0</span>
              </button>

              <button
                id="island-notif-badge"
                class="gd-island-chip"
                type="button"
                title="Notifications"
              >
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                  <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span id="island-notif-count">0</span>
              </button>

              <button
                id="island-controls-badge"
                class="gd-island-icon-chip"
                type="button"
                title="Control Center"
                aria-label="Open Control Center"
              >
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="4" y1="21" x2="4" y2="14"></line>
                  <line x1="4" y1="10" x2="4" y2="3"></line>
                  <line x1="12" y1="21" x2="12" y2="12"></line>
                  <line x1="12" y1="8" x2="12" y2="3"></line>
                  <line x1="20" y1="21" x2="20" y2="16"></line>
                  <line x1="20" y1="12" x2="20" y2="3"></line>
                  <line x1="1" y1="14" x2="7" y2="14"></line>
                  <line x1="9" y1="8" x2="15" y2="8"></line>
                  <line x1="17" y1="16" x2="23" y2="16"></line>
                </svg>
              </button>
            </div>

            <!-- External Drag-Enter State -->
            <div class="gd-island-drop" id="island-drop" aria-hidden="true">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                <line x1="12" y1="11" x2="12" y2="17"></line>
                <polyline points="9 14 12 17 15 14"></polyline>
              </svg>
              <span class="gd-drop-label">Drop your files here</span>
            </div>

            <!-- Drop Success Feedback State -->
            <div class="gd-island-feedback" id="island-feedback" aria-hidden="true">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
              <span id="island-feedback-text">Files held</span>
            </div>
          </div>
        </div>

        <!-- RIGHT ZONE (visible in Top Bar mode) -->
        <div class="gd-zone gd-zone-right">
          <button
            id="sys-kbd-btn"
            class="gd-sys-pill"
            type="button"
            title="Keyboard Language (Open Language Settings)"
          >
            <span id="sys-kbd-code">ENG</span>
          </button>

          <button
            id="sys-battery-btn"
            class="gd-sys-pill gd-battery"
            type="button"
            title="Battery Status"
          >
            <span id="sys-battery-icon" class="gd-icon"></span>
            <span id="sys-battery-pct">--</span>
          </button>

          <button
            id="sys-volume-btn"
            class="gd-sys-icon-btn"
            type="button"
            title="Volume Controls"
            aria-label="Volume Controls"
          >
            <span id="sys-volume-icon" class="gd-icon"></span>
          </button>

          <button
            id="sys-wifi-btn"
            class="gd-sys-icon-btn"
            type="button"
            title="Network & Wi-Fi Status"
            aria-label="Network Status"
          >
            <span id="sys-wifi-icon" class="gd-icon"></span>
          </button>

          <button
            id="sys-controls-btn"
            class="gd-sys-icon-btn"
            type="button"
            title="Control Center"
            aria-label="Control Center"
          >
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="7" rx="3.5"></rect>
              <circle cx="17.5" cy="7.5" r="2.2" fill="currentColor"></circle>
              <rect x="3" y="13" width="18" height="7" rx="3.5"></rect>
              <circle cx="6.5" cy="16.5" r="2.2" fill="currentColor"></circle>
            </svg>
          </button>

          <button
            id="sys-settings-btn"
            class="gd-sys-icon-btn"
            type="button"
            title="GLASSDESK Settings"
            aria-label="GLASSDESK Settings"
          >
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>

          <button
            id="sys-clock-btn"
            class="gd-sys-pill gd-clock-btn"
            type="button"
            title="Clock & Calendar"
          >
            <span id="topbar-date">---</span>
            <span id="topbar-time">--:--</span>
          </button>
        </div>
      </header>

      <!-- Transparent Outside-Click Dismissal Backdrop (active only when expanded) -->
      <div id="overlay-backdrop" class="gd-backdrop" aria-hidden="true"></div>

      <!-- Attached Floating Drop Zone Sheet (visible during external Explorer drag-over) -->
      <div id="drop-zone-sheet" class="gd-drop-sheet glass-panel" aria-hidden="true">
        <div class="gd-drop-sheet-inner">
          <div class="gd-drop-icon-ring">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
              <line x1="12" y1="11" x2="12" y2="17"></line>
              <polyline points="9 14 12 17 15 14"></polyline>
            </svg>
          </div>
          <div class="gd-drop-copy">
            <div class="gd-drop-title">Drop your files here</div>
            <div class="gd-drop-sub">Safe file shelf — original files remain untouched on disk</div>
          </div>
        </div>
      </div>

      <!-- Expandable Attached Panel Host -->
      <main id="panel-host" class="gd-panel-host" aria-hidden="true">
        <!-- Dynamic Island Mode Switcher Dock (appears above expanded panels) -->
        <nav id="island-mode-dock" class="gd-mode-dock glass-primary" aria-label="Dynamic Island Modes" hidden>
          <button class="gd-mode-tab" data-mode="hub" type="button">Overview</button>
          <button class="gd-mode-tab" data-mode="calendar" type="button">Time</button>
          <button class="gd-mode-tab" data-mode="tasks" type="button">Tasks</button>
          <button class="gd-mode-tab" data-mode="files" type="button">Files</button>
          <button class="gd-mode-tab" data-mode="controls" type="button">Control Center</button>
          <button class="gd-mode-tab" data-mode="notifications" type="button">Notifications</button>
          <button class="gd-mode-tab" data-mode="music" type="button">Media</button>
          <button class="gd-mode-tab" data-mode="settings" type="button">Settings</button>
        </nav>

        <!-- Mode A/Overview: Dynamic Island Hub -->
        <section id="panel-hub" class="gd-panel glass-panel" data-panel="hub" hidden></section>

        <!-- Mode B: Time & Calendar -->
        <section id="panel-calendar" class="gd-panel glass-panel" data-panel="calendar" hidden></section>

        <!-- Mode C: Tasks & Reminders -->
        <section id="panel-tasks" class="gd-panel glass-panel" data-panel="tasks" hidden></section>

        <!-- Mode D: File Drop & Shelf -->
        <section id="panel-files" class="gd-panel glass-panel" data-panel="files" hidden></section>

        <!-- Mode E: macOS-Inspired Control Center -->
        <section id="panel-controls" class="gd-panel glass-panel" data-panel="controls" hidden></section>

        <!-- Mode F: Notifications Center -->
        <section id="panel-notifications" class="gd-panel glass-panel" data-panel="notifications" hidden></section>

        <!-- Media / Now Playing -->
        <section id="panel-music" class="gd-panel glass-panel" data-panel="music" hidden></section>

        <!-- Two-Pane Premium Settings -->
        <section id="panel-settings" class="gd-panel glass-panel" data-panel="settings" hidden></section>
      </main>

      <!-- Subtle Glass Toast Feedback -->
      <div id="gd-toast" class="gd-toast glass-primary" role="status" aria-live="polite"></div>
    </div>

    <script type="module" src="./scripts/main.ts"></script>
  </body>
</html>
